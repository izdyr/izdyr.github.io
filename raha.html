<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>سَمبار — سازمان مدیریت بحران آزمون رها</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F8F7;
  --card:#FFFFFF;
  --ink:#1E3A41;
  --muted:#6C8A90;
  --line:#DCEAE8;
  --firoozeh:#14A098;
  --firoozeh-dark:#0E7A74;
  --firoozeh-soft:#DFF3F1;
  --saffron:#F6B93B;
  --saffron-dark:#D99A1B;
  --saffron-soft:#FDF0D7;
  --coral:#F0876F;
  --coral-dark:#D9694F;
  --coral-soft:#FDEAE4;
  --green:#3FBF7F;
  --green-dark:#2E9A64;
  --green-soft:#E2F6EC;
  --radius:18px;
  --shadow:0 8px 24px rgba(30,58,65,.07);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Vazirmatn',sans-serif;
  font-size:16px;
  line-height:1.9;
  min-height:100vh;
  background-image:
    radial-gradient(circle at 15% 10%, rgba(20,160,152,.06), transparent 40%),
    radial-gradient(circle at 85% 90%, rgba(246,185,59,.07), transparent 40%);
}
#app{max-width:520px;margin:0 auto;padding:16px 16px 40px;position:relative;}
.screen{animation:screenIn .38s cubic-bezier(.22,1,.36,1) both;}
@keyframes screenIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ---------- سربرگ خانه ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 14px;}
.brand h1{font-family:'Lalezar',cursive;font-size:30px;margin:0;color:var(--firoozeh-dark);letter-spacing:.5px;line-height:1;}
.brand small{display:block;font-size:11px;font-weight:500;color:var(--muted);margin-top:2px;}
.stats{display:flex;gap:8px;align-items:center;}
.stat-chip{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:4px 12px;font-weight:800;font-size:14px;display:flex;align-items:center;gap:5px;box-shadow:0 2px 0 var(--line);white-space:nowrap;}
.stat-chip.fire{color:#E2743B;}
.stat-chip.xp{color:var(--saffron-dark);}
.sound-btn{background:var(--card);border:2px solid var(--line);border-radius:14px;width:38px;height:38px;font-size:17px;cursor:pointer;box-shadow:0 2px 0 var(--line);transition:transform .15s;}
.sound-btn:active{transform:translateY(2px);box-shadow:none;}

/* ---------- هیرو / پیشرفت کل ---------- */
.hero{
  background:linear-gradient(140deg,#12958D 0%,#0E7A74 55%,#0B6560 100%);
  border-radius:26px;
  padding:22px 22px 20px;
  color:#fff;
  position:relative;
  overflow:hidden;
  box-shadow:0 14px 34px rgba(14,122,116,.28);
  margin-bottom:22px;
}
.hero::before{
  content:'';position:absolute;inset:0;
  background-image:radial-gradient(circle at 90% -20%, rgba(255,255,255,.16), transparent 55%);
  pointer-events:none;
}
.hero .hello{font-size:15px;font-weight:600;opacity:.9;margin:0;}
.hero .big{display:flex;align-items:baseline;gap:8px;margin:2px 0 12px;}
.hero .pct{font-family:'Lalezar';font-size:52px;line-height:1;}
.hero .pct-label{font-size:13px;font-weight:600;opacity:.85;}
.hero-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;}
.mascot{width:76px;height:76px;flex:none;filter:drop-shadow(0 6px 10px rgba(0,0,0,.18));animation:float 3.6s ease-in-out infinite;}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.tiles{display:grid;grid-template-columns:repeat(12,1fr);gap:7px;padding:4px 2px 0;}
.tile{width:100%;aspect-ratio:1;background:rgba(255,255,255,.18);transform:rotate(45deg) scale(.72);border-radius:3px;transition:background .4s, box-shadow .4s;}
.tile.on{background:var(--saffron);box-shadow:0 0 10px rgba(246,185,59,.55);}
.hero .tiles-caption{font-size:11.5px;opacity:.75;margin:10px 2px 0;font-weight:500;}
.sync-note{font-size:11px;font-weight:600;opacity:.7;display:flex;align-items:center;gap:5px;margin-top:6px;}

/* ---------- کارت‌های موضوع ---------- */
.section-title{font-family:'Lalezar';font-size:22px;color:var(--ink);margin:4px 4px 12px;}
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.cat-card{
  background:var(--card);border:2px solid var(--line);border-radius:var(--radius);
  padding:14px 14px 12px;box-shadow:0 3px 0 var(--line);
  display:flex;flex-direction:column;gap:8px;
}
.cat-head{display:flex;align-items:center;gap:9px;}
.cat-icon{width:42px;height:42px;flex:none;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:21px;}
.cat-name{font-weight:800;font-size:14.5px;line-height:1.4;}
.cat-count{font-size:11px;color:var(--muted);font-weight:500;}
.due-badge{font-size:10.5px;font-weight:800;color:#E2743B;background:#FDEEDB;border-radius:99px;padding:1px 8px;display:inline-block;margin-top:1px;}
.mini-bar{height:8px;background:#EAF3F2;border-radius:99px;overflow:hidden;}
.mini-fill{height:100%;background:linear-gradient(90deg,var(--firoozeh),#2BC1B8);border-radius:99px;transition:width .6s cubic-bezier(.22,1,.36,1);}
.cat-actions{display:flex;gap:8px;margin-top:2px;}
.cat-actions .btn{flex:1;padding:8px 4px;font-size:13px;border-radius:13px;}

/* ---------- دکمه‌ها ---------- */
.btn{
  font-family:'Vazirmatn';font-weight:800;font-size:16px;
  border:none;border-radius:16px;padding:14px 18px;cursor:pointer;
  transition:transform .12s, box-shadow .12s, filter .15s;
  user-select:none;
}
.btn:disabled{opacity:.45;cursor:default;}
.btn-primary{background:var(--firoozeh);color:#fff;box-shadow:0 4px 0 var(--firoozeh-dark);}
.btn-primary:not(:disabled):active{transform:translateY(4px);box-shadow:0 0 0 var(--firoozeh-dark);}
.btn-saffron{background:var(--saffron);color:#5c4406;box-shadow:0 4px 0 var(--saffron-dark);}
.btn-saffron:not(:disabled):active{transform:translateY(4px);box-shadow:none;}
.btn-green{background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark);}
.btn-green:not(:disabled):active{transform:translateY(4px);box-shadow:none;}
.btn-ghost{background:var(--card);color:var(--firoozeh-dark);border:2px solid var(--line);box-shadow:0 3px 0 var(--line);}
.btn-ghost:not(:disabled):active{transform:translateY(3px);box-shadow:none;}
.btn-wide{width:100%;display:block;}
.exam-card{
  margin-top:16px;background:linear-gradient(135deg,#FDF3DC,#FBE8BC);
  border:2px solid #F2D695;border-radius:var(--radius);
  padding:16px;display:flex;align-items:center;gap:14px;
  box-shadow:0 3px 0 #ecca82;cursor:pointer;
}
.exam-card .txt{flex:1;}
.exam-card b{display:block;font-size:16px;}
.exam-card span{font-size:12.5px;color:#8a6b1e;font-weight:500;line-height:1.6;display:block;}

/* ---------- صفحه‌ی درس ---------- */
.lesson-top{display:flex;align-items:center;gap:12px;margin-bottom:20px;}
.close-x{background:none;border:none;font-size:22px;color:var(--muted);cursor:pointer;padding:4px;line-height:1;}
.qbar{flex:1;height:14px;background:#E2EEEC;border-radius:99px;overflow:hidden;position:relative;}
.qbar-fill{
  height:100%;border-radius:99px;background:linear-gradient(90deg,var(--firoozeh),#2BC1B8);
  transition:width .5s cubic-bezier(.22,1,.36,1);position:relative;overflow:hidden;
}
.qbar-fill::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);
  animation:shimmer 2.2s infinite;
}
@keyframes shimmer{from{transform:translateX(100%)}to{transform:translateX(-100%)}}
.q-kind{font-size:12px;font-weight:700;color:var(--firoozeh-dark);background:var(--firoozeh-soft);display:inline-block;padding:3px 12px;border-radius:99px;margin-bottom:10px;}
.q-prompt{font-size:18px;font-weight:800;margin:0 0 16px;line-height:2;}
.verse-box{
  background:var(--card);border:2px solid var(--line);border-radius:16px;
  padding:14px 18px;margin:0 0 18px;font-size:16.5px;font-weight:600;line-height:2.3;
  box-shadow:var(--shadow);position:relative;
}
.verse-box::before{content:'❝';position:absolute;top:-2px;left:12px;font-size:26px;color:var(--firoozeh);opacity:.35;}
.verse-box.tf-cand{border-color:#EFD9A9;background:#FFFDF6;}
.verse-box.tf-cand::before{content:'؟';color:var(--saffron-dark);opacity:.5;}

.opts{display:flex;flex-direction:column;gap:10px;}
.opts.grid2{display:grid;grid-template-columns:1fr 1fr;}
.opt{
  background:var(--card);border:2px solid var(--line);border-radius:16px;
  padding:13px 16px;font-family:'Vazirmatn';font-size:15px;font-weight:600;text-align:right;
  cursor:pointer;box-shadow:0 3px 0 var(--line);
  transition:transform .12s, box-shadow .12s, border-color .15s, background .15s;
  line-height:1.8;color:var(--ink);
}
.opts.grid2 .opt{text-align:center;font-weight:800;}
.opt:not(.locked):active{transform:translateY(3px);box-shadow:none;}
.opt.selected{border-color:var(--firoozeh);background:var(--firoozeh-soft);box-shadow:0 3px 0 var(--firoozeh);color:var(--firoozeh-dark);}
.opt.correct{border-color:var(--green);background:var(--green-soft);box-shadow:0 3px 0 var(--green);color:var(--green-dark);animation:pop .35s cubic-bezier(.22,1.4,.36,1);}
.opt.wrong{border-color:var(--coral);background:var(--coral-soft);box-shadow:0 3px 0 var(--coral);color:var(--coral-dark);animation:shake .4s;}
.opt.dim{opacity:.5;}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(5px)}50%{transform:translateX(-5px)}75%{transform:translateX(3px)}}

/* ---------- حرف‌چینی ---------- */
.asm-target{
  min-height:64px;background:var(--card);border:2px dashed var(--line);border-radius:16px;
  padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin-bottom:16px;
  transition:border-color .2s;direction:rtl;
}
.asm-target.has{border-style:solid;border-color:var(--firoozeh);}
.asm-bank{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;}
.chip{
  background:var(--card);border:2px solid var(--line);border-radius:13px;
  padding:8px 15px;font-family:'Vazirmatn';font-size:17px;font-weight:800;cursor:pointer;
  box-shadow:0 3px 0 var(--line);transition:all .15s;color:var(--ink);
}
.chip:active{transform:translateY(3px);box-shadow:none;}
.chip.in-target{border-color:var(--firoozeh);background:var(--firoozeh-soft);color:var(--firoozeh-dark);box-shadow:0 3px 0 var(--firoozeh);animation:pop .25s;}
.chip.ghost{opacity:.25;pointer-events:none;}

/* ---------- جفت‌سازی ---------- */
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start;}
.mcol{display:flex;flex-direction:column;gap:10px;}
.mchip{
  background:var(--card);border:2px solid var(--line);border-radius:14px;
  padding:11px 12px;font-family:'Vazirmatn';font-size:13.5px;font-weight:700;text-align:center;
  cursor:pointer;box-shadow:0 3px 0 var(--line);color:var(--ink);line-height:1.8;
  transition:all .15s;min-height:52px;display:flex;align-items:center;justify-content:center;
}
.mchip:active{transform:translateY(3px);box-shadow:none;}
.mchip.sel{border-color:var(--firoozeh);background:var(--firoozeh-soft);box-shadow:0 3px 0 var(--firoozeh);color:var(--firoozeh-dark);}
.mchip.done{border-color:var(--green);background:var(--green-soft);color:var(--green-dark);box-shadow:0 3px 0 var(--green);opacity:.55;pointer-events:none;animation:pop .3s;}
.mchip.err{animation:shake .4s;border-color:var(--coral);}

/* ---------- نوار بررسی و بازخورد ---------- */
.check-area{position:fixed;bottom:0;right:0;left:0;padding:14px 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 75%,transparent);z-index:5;}
.check-inner{max-width:520px;margin:0 auto;}
.feedback{
  position:fixed;bottom:0;right:0;left:0;z-index:9;
  transform:translateY(105%);transition:transform .42s cubic-bezier(.22,1.2,.36,1);
  padding-bottom:env(safe-area-inset-bottom);
}
.feedback.show{transform:translateY(0);}
.fb-inner{max-width:520px;margin:0 auto;border-radius:24px 24px 0 0;padding:20px 20px 22px;box-shadow:0 -8px 30px rgba(30,58,65,.14);}
.feedback.good .fb-inner{background:var(--green-soft);}
.feedback.bad .fb-inner{background:var(--saffron-soft);}
.fb-title{display:flex;align-items:center;gap:10px;font-family:'Lalezar';font-size:22px;margin-bottom:4px;}
.feedback.good .fb-title{color:var(--green-dark);}
.feedback.bad .fb-title{color:var(--saffron-dark);}
.fb-body{font-size:14.5px;font-weight:600;color:var(--ink);margin-bottom:14px;line-height:2;}
.fb-answer{background:#fff;border-radius:13px;padding:9px 14px;margin-top:8px;font-weight:700;border:2px solid rgba(0,0,0,.05);}
.fb-xp{display:inline-block;background:#fff;border-radius:99px;padding:2px 12px;font-weight:800;font-size:13px;color:var(--saffron-dark);margin-left:8px;box-shadow:0 2px 0 rgba(0,0,0,.06);}
.fb-combo{display:inline-block;background:#fff;border-radius:99px;padding:2px 12px;font-weight:800;font-size:13px;color:#E2743B;box-shadow:0 2px 0 rgba(0,0,0,.06);}
.feedback .btn{width:100%;}
.feedback.good .btn{background:var(--green);box-shadow:0 4px 0 var(--green-dark);color:#fff;}
.feedback.bad .btn{background:var(--saffron);box-shadow:0 4px 0 var(--saffron-dark);color:#5c4406;}

/* ---------- فلش‌کارت ---------- */
.flash-wrap{perspective:1200px;margin:10px 0 22px;}
.flash-card{
  position:relative;width:100%;min-height:290px;
  transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,1.1,.4,1);cursor:pointer;
}
.flash-card.flipped{transform:rotateY(180deg);}
.flash-face{
  position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:26px;text-align:center;gap:10px;
}
.flash-front{background:var(--card);border:2px solid var(--line);box-shadow:var(--shadow);}
.flash-front .word{font-size:22px;font-weight:900;line-height:2.1;}
.flash-back{
  background:linear-gradient(140deg,#12958D,#0B6560);color:#fff;transform:rotateY(180deg);
  box-shadow:0 14px 30px rgba(14,122,116,.3);
}
.flash-back .word{font-size:18px;font-weight:700;line-height:2.1;}
.flash-hint{font-size:12px;color:var(--muted);font-weight:600;}
.flash-back .flash-hint{color:rgba(255,255,255,.7);}
.flash-grade{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.flash-dots{display:flex;gap:6px;justify-content:center;margin-bottom:14px;flex-wrap:wrap;}
.fdot{width:9px;height:9px;border-radius:99px;background:#D8E8E6;transition:all .3s;}
.fdot.on{background:var(--firoozeh);transform:scale(1.25);}
.fdot.done{background:var(--saffron);}

/* ---------- نتیجه ---------- */
.result{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:26px;}
.result .mascot{width:110px;height:110px;margin-bottom:6px;}
.result h2{font-family:'Lalezar';font-size:32px;margin:6px 0 2px;color:var(--firoozeh-dark);}
.result p{color:var(--muted);font-weight:600;margin:0 0 22px;font-size:14.5px;}
.result-cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;margin-bottom:26px;}
.res-card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 3px 0 var(--line);}
.res-card .val{font-family:'Lalezar';font-size:28px;line-height:1.2;}
.res-card .lbl{font-size:12px;color:var(--muted);font-weight:700;}
.res-card.gold .val{color:var(--saffron-dark);}
.res-card.teal .val{color:var(--firoozeh-dark);}

.timer{font-weight:900;font-size:15px;color:var(--coral-dark);background:var(--coral-soft);border-radius:99px;padding:3px 13px;min-width:64px;text-align:center;font-variant-numeric:tabular-nums;}

.confetti{position:fixed;top:-12px;z-index:99;border-radius:3px;pointer-events:none;animation:fall linear forwards;}
@keyframes fall{
  0%{transform:translateY(0) rotate(0);opacity:1}
  100%{transform:translateY(105vh) rotate(720deg);opacity:.6}
}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001s !important;transition-duration:.05s !important;}
}
@media (max-width:380px){
  .cat-grid{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ==========================================================================
   ✦ سَمبار — سازمان مدیریت بحران آزمون رها ✦
   داده‌ها از جزوه‌های شب امتحان فارسی یازدهم استخراج شده‌اند.
   قالب‌ها:  vocab {w,m} · history/concepts {q,a} · araye {v,a} یا {q,a}
             grammar {q,a} یا {q,options,answer,explain}
   ========================================================================== */

const DATA = {
vocab: [
  {w:'ادبار', m:'بدبختی، سیه‌روزی؛ متضادّ اقبال'},
  {w:'اقبال', m:'خوشبختی، سعادت'},
  {w:'توفیق', m:'موافق کردن اسباب از سوی خدا تا خواهش بنده به نتیجه برسد'},
  {w:'تیره‌رایی', m:'بداندیشی، گمراهی'},
  {w:'چاشنی‌بخش', m:'آنچه برای اثربخشی بیشتر کلام به آن افزوده می‌شود'},
  {w:'حلاوت', m:'شیرینی'},
  {w:'نژند', m:'خوار و زبون'},
  {w:'جیب', m:'گریبان، یقه'},
  {w:'چنگ', m:'نوعی ساز که سرِ آن خمیده است و تارها دارد'},
  {w:'حمیّت', m:'غیرت، جوانمردی، مردانگی'},
  {w:'خُطوات', m:'جمعِ خُطوه؛ گام‌ها، قدم‌ها'},
  {w:'دَغَل', m:'ناراست، حیله‌گر'},
  {w:'راغ', m:'دامنهٔ سبز کوه، صحرا'},
  {w:'روضه', m:'باغ، گلزار'},
  {w:'دون‌همّت', m:'کوتاه‌همت، دارای طبع پست و کوتاه‌اندیشه'},
  {w:'زَنَخدان', m:'چانه'},
  {w:'شغال', m:'جانوری پستاندار از تیرهٔ سگان و رستهٔ گوشتخواران'},
  {w:'شَل', m:'دست‌وپا ازکارافتاده'},
  {w:'شوریده‌رنگ', m:'آشفته‌حال'},
  {w:'غرامت‌زده', m:'تاوان‌زده، پشیمان'},
  {w:'غیب', m:'پنهان، نهان از چشم؛ عالمی که فرشتگان در آن‌اند'},
  {w:'فراغ', m:'آسایش، آسودگی'},
  {w:'فروماندن', m:'متحیّر شدن'},
  {w:'فیروزه‌فام', m:'به رنگ فیروزه'},
  {w:'قُوت', m:'رزق روزانه، خوراک، غذا'},
  {w:'متقارب', m:'نزدیک به هم، در کنار هم'},
  {w:'مرغزار', m:'سبزه‌زار، زمینِ دارای علف‌های خودرو'},
  {w:'اذن', m:'اجازه، رخصت'},
  {w:'اعطا', m:'واگذاری، بخشش، عطا کردن'},
  {w:'افراط', m:'از حد درگذشتن، زیاده‌روی؛ مقابلِ تفریط'},
  {w:'التهاب', m:'شعله‌ور شدن؛ مجازاً ناآرامی و اضطراب'},
  {w:'اهتزاز', m:'حرکت، جنبش'},
  {w:'بَختک', m:'کابوس؛ سیاهی‌ای که بر شخصِ خوابیده می‌افتد'},

/* ---------- صدا ---------- */
let audioCtx = null;
function tone(freq, t=0.12, delay=0, type='sine', vol=0.05){
  if(!state.sound) return;
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(0, audioCtx.currentTime+delay);
    g.gain.linearRampToValueAtTime(vol, audioCtx.currentTime+delay+0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime+delay+t);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(audioCtx.currentTime+delay); o.stop(audioCtx.currentTime+delay+t+0.05);
  }catch(e){}
}

/* ---------- وضعیت و ذخیره‌سازی ابری (مشترک بین همهٔ دستگاه‌ها) ---------- */
const SKEY = 'sambad-raha-v2';
let state = { items:{}, xp:0, streak:0, lastDay:null, sound:true, sessions:0 };
let saveTimer = null;

async function loadState(){
  try{
    const r = await window.storage.get(SKEY, true);
    if(r && r.value) state = Object.assign(state, JSON.parse(r.value));
  }catch(e){ /* نخستین اجرا: هنوز چیزی ذخیره نشده */ }
}
function saveState(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flushState, 350);
}
async function flushState(){
  clearTimeout(saveTimer);
  try{ await window.storage.set(SKEY, JSON.stringify(state), true); }catch(e){}
}
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) flushState(); });

/* ---------- مرور فاصله‌دار (لایتنر) ---------- */
const INTERVALS = [5*60e3, 30*60e3, 8*3600e3, 24*3600e3, 3*24*3600e3, 7*24*3600e3, 14*24*3600e3];
const MASTER_BOX = 4;
const itemId = (cat,i) => cat+':'+i;
function itemState(id){
  if(!state.items[id]) state.items[id] = {box:0, due:0, seen:0, lastV:''};
  return state.items[id];
}
function gradeItem(id, ok){
  const it = itemState(id);
  it.seen++;
  if(ok){ it.box = Math.min(it.box+1, INTERVALS.length); }
  else  { it.box = Math.max(it.box-2, 0); }
  it.due = Date.now() + INTERVALS[Math.max(it.box-1,0)];
  saveState();
}
function catStats(catId){
  const n = DATA[catId].length, now = Date.now();
  let mastered=0, seen=0, due=0;
  for(let i=0;i<n;i++){
    const it = state.items[itemId(catId,i)];
    if(it && it.seen>0){
      seen++;
      if(it.box>=MASTER_BOX) mastered++;
      if(it.due<=now) due++;
    }
  }
  return {n, mastered, seen, due, pct: n? mastered/n : 0};
}
function totalStats(){
  let n=0, m=0;
  CATS.forEach(c=>{ const s=catStats(c.id); n+=s.n; m+=s.mastered; });
  return {n, m, pct: n? m/n : 0};
}
function touchStreak(){
  const today = new Date().toDateString();
  if(state.lastDay === today) return;
  const yest = new Date(Date.now()-864e5).toDateString();
  state.streak = (state.lastDay === yest) ? state.streak+1 : 1;
  state.lastDay = today;
  saveState();
}
function pickSessionItems(catId, count){
  const n = DATA[catId].length, now = Date.now();
  const due=[], fresh=[], rest=[];
  for(let i=0;i<n;i++){
    const it = state.items[itemId(catId,i)];
    if(!it || it.seen===0) fresh.push(i);
    else if(it.due <= now) due.push(i);
    else rest.push(i);
  }
  rest.sort((a,b)=> itemState(itemId(catId,a)).box - itemState(itemId(catId,b)).box);
  return [...shuffle(due), ...shuffle(fresh), ...rest].slice(0, count);
}

    document.body.appendChild(d);
    setTimeout(()=>d.remove(), 3200);
  }
}

function pickDistractB(catId, correct, n){
  const vals = DATA[catId].filter(it=>!it.options || catId==='grammar').map(getB);
  let pool = [...new Set(vals)].filter(v=> clean(v)!==clean(correct) && !overlaps(v, correct));
  pool = shuffle(pool);
  if(pool.length < n){
    const extra = shuffle([...new Set(vals)].filter(v=> clean(v)!==clean(correct) && !pool.includes(v)));
    pool = pool.concat(extra);
  }
  return pool.slice(0, n);
}
function pickDistractF(catId, item, n){
  const b = clean(getB(item));
  let pool = DATA[catId].filter(it=> it!==item && !it.options && clean(getB(it))!==b).map(getF);
  pool = [...new Set(pool)].filter(f=> clean(f)!==clean(getF(item)));
  return shuffle(pool).slice(0, n);
}
function matchPartners(catId, idx){
  const item = DATA[catId][idx];
  if(item.options) return null;
  const ok = it => !it.options && getF(it).length<=48 && getB(it).length<=42;
  if(!ok(item)) return null;
  const chosen = [{f:getF(item), b:getB(item), idx}];
  const cands = shuffle(DATA[catId].map((it,i)=>({it,i})).filter(x=> x.i!==idx && ok(x.it)));
  for(const c of cands){
    if(chosen.length===4) break;
    const b = getB(c.it);
    if(chosen.every(p=> clean(p.b)!==clean(b) && !overlaps(p.b, b))){
      chosen.push({f:getF(c.it), b, idx:c.i});
    }
  }
  return chosen.length===4 ? chosen : null;
}
function variantsFor(catId, idx){
  const item = DATA[catId][idx];
  if(item.options) return ['quiz'];
  const v = ['mc','tf'];
  if(catId!=='concepts') v.push('mcRev');
  if(catId==='vocab'){
    const L = Array.from(getF(item).replace(/\u200c/g,'')).filter(ch=>ch!==' ');
    if(L.length>=3 && L.length<=9) v.push('letters');
  }
  if(matchPartners(catId, idx)) v.push('match');
  return v;
}

function makeQuestion(catId, idx, examMode=false){
  const item = DATA[catId][idx];
  const id = itemId(catId, idx);
  const st = itemState(id);
  const F = getF(item), B = getB(item);

  let avail = variantsFor(catId, idx);
  if(examMode) avail = avail.filter(x=>['quiz','mc','tf'].includes(x));
  let v;
  if(st.seen===0) v = avail.includes('quiz') ? 'quiz' : 'mc';   /* بار اول: آشنایی ساده */
  else {
    const opts = avail.length>1 ? avail.filter(x=>x!==st.lastV) : avail;
    v = pick(opts);
  }
  st.lastV = v;

  /* تست‌های آمادهٔ جزوه */
  if(v==='quiz'){
    const opts = shuffle(item.options.map((t,i)=>({t, ok:i===item.answer})));
    return {id, kind:'mc', v, prompt:item.q, options:opts, answerText:B, explain:item.explain||''};
  }

  const isBayt = !!item.v;

  if(v==='mc'){
    const opts = shuffle([{t:B,ok:true}, ...pickDistractB(catId, B, 3).map(t=>({t,ok:false}))]);
    if(catId==='vocab') return {id, kind:'mc', v, prompt:`معنی واژهٔ «${F}» چیست؟`, options:opts, answerText:B};
    if(catId==='araye') return {id, kind:'mc', v, prompt: isBayt?'کدام آرایه در بیت زیر دیده می‌شود؟':'این توصیف مربوط به کدام آرایه است؟', verse:F, options:opts, answerText:B, explain:item.explain||''};
    return {id, kind:'mc', v, prompt:F, options:opts, answerText:B, explain:item.explain||''};
  }

  if(v==='mcRev'){
    const opts = shuffle([{t:F,ok:true}, ...pickDistractF(catId, item, 3).map(t=>({t,ok:false}))]);
    if(catId==='vocab') return {id, kind:'mc', v, prompt:`کدام واژه به معنای «${B}» است؟`, options:opts, answerText:F};
    if(catId==='araye') return {id, kind:'mc', v, prompt:`کدام مورد، نمونه یا توصیفی از «${B}» است؟`, options:opts, answerText:F};
    return {id, kind:'mc', v, prompt:`«${B}» پاسخِ کدام پرسش است؟`, options:opts, answerText:F};
  }

  if(v==='tf'){
    const wrongs = pickDistractB(catId, B, 1);
    const isTrue = wrongs.length ? Math.random()<0.5 : true;
    const cand = isTrue ? B : wrongs[0];
    const opts = shuffle([{t:'✅ درست', ok:isTrue},{t:'❌ نادرست', ok:!isTrue}]);
    let prompt, verse;
    if(catId==='vocab'){ prompt='درست یا نادرست؟'; verse=`«${F}» یعنی: ${cand}`; }
    else if(catId==='araye' && isBayt){ prompt=`در این بیت آرایهٔ «${cand}» به‌کار رفته؛ درست یا نادرست؟`; verse=F; }
    else { prompt=F; verse=`پاسخ: ${cand}`; }
    return {id, kind:'mc', v, grid:true, tfStyle:!(catId==='araye'&&isBayt), prompt, verse, options:opts, answerText:B};
  }

  if(v==='letters'){
    const letters = Array.from(F.replace(/\u200c/g,'')).filter(ch=>ch!==' ');
    return {id, kind:'letters', v, prompt:`واژه‌ای به معنی «${B}» را حرف‌به‌حرف بساز:`, chips:shuffle(letters.map((t,i)=>({t,i}))), answerSeq:letters, answerText:F};
  }

  /* match */
  const pairs = matchPartners(catId, idx);
  return {id, kind:'match', v, prompt:'هر مورد را به جفتِ درستش وصل کن:', pairs, answerText:''};
}

/* ---------- جلسه ---------- */
let session = null;
function startLesson(catId){
  const idxs = pickSessionItems(catId, 8);
  session = {mode:'lesson', catId, queue:idxs.map(i=>({catId, idx:i})), total:idxs.length, done:0, correct:0, wrong:0, xp:0, combo:0};
  nextQuestion();
}
function startExam(){
  const pool = [];
  CATS.forEach(c=> DATA[c.id].forEach((_,i)=> pool.push({catId:c.id, idx:i})));
  const qs = shuffle(pool).slice(0,10);
  session = {mode:'exam', queue:qs, total:qs.length, done:0, correct:0, wrong:0, xp:0, combo:0, deadline:Date.now()+10*60e3};
  nextQuestion();
}
function nextQuestion(){
  if(!session.queue.length) return renderResult();
  const {catId, idx} = session.queue.shift();
  renderQuestion(makeQuestion(catId, idx, session.mode==='exam'), catId, idx);
}

function renderQuestion(q, catId, idx){
  const cat = CATS.find(c=>c.id===catId);
  const prog = session.done / session.total * 100;
  let picked = null, seq = [];

  app.innerHTML = `
  <div class="screen" style="padding-bottom:120px">
    <div class="lesson-top">
      <button class="close-x" id="quitBtn">✕</button>
      <div class="qbar"><div class="qbar-fill" style="width:${prog}%"></div></div>
      ${session.mode==='exam' ? '<div class="timer" id="timer">۱۰:۰۰</div>' : `<div class="stat-chip xp" style="font-size:13px">⭐ ${toFa(session.xp)}</div>`}
    </div>
    <span class="q-kind">${cat.icon} ${cat.name} · ${KINDS[q.v]||KINDS[q.kind]||''}</span>
    <p class="q-prompt">${esc(q.prompt)}</p>
    ${q.verse ? `<div class="verse-box ${q.tfStyle?'tf-cand':''}">${esc(q.verse)}</div>` : ''}
    <div id="qBody"></div>
  </div>
  <div class="check-area" id="checkArea"><div class="check-inner">
    <button class="btn btn-primary btn-wide" id="checkBtn" disabled>بررسی</button>
  </div></div>
  <div class="feedback" id="fb"><div class="fb-inner">
    <div class="fb-title" id="fbTitle"></div>
    <div class="fb-body" id="fbBody"></div>
    <button class="btn" id="fbNext">ادامه</button>
  </div></div>`;

  const body = $('#qBody'), checkBtn = $('#checkBtn');

  if(q.kind==='mc'){
    body.innerHTML = `<div class="opts ${q.grid?'grid2':''}">${q.options.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o.t)}</button>`).join('')}</div>`;
    body.querySelectorAll('.opt').forEach(el=>{
      el.onclick = () => {
        if(el.classList.contains('locked')) return;
        sTap();
        body.querySelectorAll('.opt').forEach(x=>x.classList.remove('selected'));
        el.classList.add('selected');
        picked = +el.dataset.i;
        checkBtn.disabled = false;
      };
    });
    checkBtn.onclick = () => {
      const ok = q.options[picked].ok;
      body.querySelectorAll('.opt').forEach((el,i)=>{
        el.classList.add('locked');
        if(q.options[i].ok) el.classList.add('correct');
        else if(i===picked) el.classList.add('wrong');
        else el.classList.add('dim');
      });
      gradeItem(q.id, ok);
      finishQuestion(ok, q, catId, idx);
    };
  }
  else if(q.kind==='letters'){
    body.innerHTML = `
      <div class="asm-target" id="target"></div>
      <div class="asm-bank" id="bank">${q.chips.map((c,i)=>`<button class="chip" data-i="${i}">${esc(c.t)}</button>`).join('')}</div>`;
    const target = $('#target'), bank = $('#bank');
    const sync = () => {
      target.innerHTML = seq.map(i=>`<button class="chip in-target" data-i="${i}">${esc(q.chips[i].t)}</button>`).join('');
      target.classList.toggle('has', seq.length>0);
      bank.querySelectorAll('.chip').forEach(el=> el.classList.toggle('ghost', seq.includes(+el.dataset.i)));
      target.querySelectorAll('.chip').forEach(el=> el.onclick = () => { sTap(); seq = seq.filter(x=>x!==+el.dataset.i); sync(); });
      checkBtn.disabled = seq.length !== q.answerSeq.length;
    };
    bank.querySelectorAll('.chip').forEach(el=> el.onclick = () => {
      if(el.classList.contains('ghost')) return;
      sTap(); seq.push(+el.dataset.i); sync();
    });
    sync();
    checkBtn.onclick = () => {
      const built = seq.map(i=>q.chips[i].t).join('');
      const ok = clean(built) === clean(q.answerSeq.join(''));
      target.querySelectorAll('.chip').forEach(el=>{
        el.style.pointerEvents='none';
        el.classList.remove('in-target');
        el.style.borderColor = ok?'var(--green)':'var(--coral)';
        el.style.background = ok?'var(--green-soft)':'var(--coral-soft)';
        el.style.color = ok?'var(--green-dark)':'var(--coral-dark)';
        el.style.boxShadow = `0 3px 0 ${ok?'var(--green)':'var(--coral)'}`;
      });
      gradeItem(q.id, ok);
      finishQuestion(ok, q, catId, idx);
    };
  }
  else if(q.kind==='match'){
    checkBtn.style.display='none';
    const fronts = shuffle(q.pairs.map((p,i)=>({t:p.f, i})));
    const backs  = shuffle(q.pairs.map((p,i)=>({t:p.b, i})));
    body.innerHTML = `<div class="match-grid">
      <div class="mcol" id="colF">${fronts.map(x=>`<button class="mchip" data-i="${x.i}">${esc(x.t)}</button>`).join('')}</div>
      <div class="mcol" id="colB">${backs.map(x=>`<button class="mchip" data-i="${x.i}">${esc(x.t)}</button>`).join('')}</div>
    </div>`;
    let selF=null, selB=null, matched=0;
    const erred = new Set();
    const trySolve = () => {
      if(selF===null || selB===null) return;
      const fEl = body.querySelector(`#colF .mchip[data-i="${selF}"]`);
      const bEl = body.querySelector(`#colB .mchip[data-i="${selB}"]`);
      if(selF===selB){
        fEl.classList.remove('sel'); bEl.classList.remove('sel');
        fEl.classList.add('done'); bEl.classList.add('done');
        matched++; sPair();
        if(matched===q.pairs.length){
          const ok = erred.size===0;
          q.pairs.forEach(p=> gradeItem(itemId(catId, p.idx), !erred.has(p.idx)));
          setTimeout(()=> finishQuestion(ok, q, catId, idx, true), 450);
        }
      } else {
        erred.add(selF); erred.add(selB);
        fEl.classList.add('err'); bEl.classList.add('err'); sSoft();
        setTimeout(()=>{ fEl.classList.remove('sel','err'); bEl.classList.remove('sel','err'); }, 420);
      }
      selF=null; selB=null;
    };
    body.querySelectorAll('#colF .mchip').forEach(el=> el.onclick = () => {
      if(el.classList.contains('done')) return;
      sTap();
      body.querySelectorAll('#colF .mchip').forEach(x=>x.classList.remove('sel'));
      el.classList.add('sel'); selF = +el.dataset.i; trySolve();
    });
    body.querySelectorAll('#colB .mchip').forEach(el=> el.onclick = () => {
      if(el.classList.contains('done')) return;
      sTap();
      body.querySelectorAll('#colB .mchip').forEach(x=>x.classList.remove('sel'));
      el.classList.add('sel'); selB = +el.dataset.i; trySolve();
    });
  }

  /* زمان سنج آزمون */
  if(session.mode==='exam'){
    const tEl = $('#timer');
    const tick = setInterval(()=>{
      if(!document.body.contains(tEl)){ clearInterval(tick); return; }
      const left = Math.max(0, session.deadline - Date.now());
      const m = Math.floor(left/60000), s = Math.floor(left%60000/1000);
      tEl.textContent = toFa(String(m).padStart(2,'0'))+':'+toFa(String(s).padStart(2,'0'));
      if(left<=0){ clearInterval(tick); renderResult(true); }
    }, 500);
  }

  $('#quitBtn').onclick = () => { sTap(); flushState(); renderHome(); };
}

function finishQuestion(ok, q, catId, idx, isMatch=false){
  session.done++;
  const fb = $('#fb');
  const ca = $('#checkArea'); if(ca) ca.style.display='none';
  fb.classList.remove('good','bad');
  fb.classList.add(ok?'good':'bad');

  if(ok){
    session.correct++;
    session.combo++;
    let gained = isMatch ? 14 : (q.kind==='letters' ? 14 : (session.mode==='exam' ? 12 : 10));
    if(session.combo>0 && session.combo%5===0) gained += 5;
    session.xp += gained; state.xp += gained; saveState();
    $('#fbTitle').innerHTML = `✅ ${pick(PRAISE)}`;
    $('#fbBody').innerHTML =
      `<span class="fb-xp">+${toFa(gained)} ⭐</span>` +
      (session.combo>=2 ? `<span class="fb-combo">${toFa(session.combo)} تای پشت‌سرهم! 🔥</span>` : '') +
      (q.explain ? `<div class="fb-answer">💡 ${esc(q.explain)}</div>` : '');
    sGood();
    if(session.combo>0 && session.combo%3===0) confetti(16);
  } else {
    session.wrong++;
    session.combo = 0;
    if(session.mode==='lesson') session.queue.push({catId, idx});
    $('#fbTitle').innerHTML = `🌱 ${pick(GENTLE)}`;
    $('#fbBody').innerHTML = isMatch
      ? `چندتا جفت قاطی شدن؛ دوباره باهم مرورشون می‌کنیم 💛`
      : `پاسخ درست:<div class="fb-answer">${esc(q.answerText)}</div>${q.explain?`<div class="fb-answer" style="margin-top:6px">💡 ${esc(q.explain)}</div>`:''}`;
    sSoft();
  }
  requestAnimationFrame(()=> fb.classList.add('show'));
  $('#fbNext').onclick = () => { sTap(); nextQuestion(); };
}

}

  app.innerHTML = `

    <h2>${title}</h2>
    <p>${sub}</p>
    <div class="result-cards">
      <div class="res-card gold"><div class="val">+${toFa(isFlash? session.know*5 : session.xp)} ⭐</div><div class="lbl">امتیاز این جلسه</div></div>
      <div class="res-card teal"><div class="val">${toFa(acc)}٪</div><div class="lbl">${isFlash?'کارت‌های بلد':'پاسخ های درست'}</div></div>
      <div class="res-card"><div class="val">🔥 ${toFa(state.streak)}</div><div class="lbl">روز پیاپی تمرین</div></div>
      <div class="res-card"><div class="val">${toFa(Math.round(totalStats().pct*100))}٪</div><div class="lbl">پیشرفت کل دوره</div></div>
    </div>
    <button class="btn btn-primary btn-wide" id="homeBtn">بازگشت به خانه</button>
    <div style="height:10px"></div>
    <button class="btn btn-ghost btn-wide" id="againBtn">یه دور دیگه! 🔁</button>
  </div>`;

  if(acc>=50 && !timeUp){ sWin(); confetti(40); } else { sGood(); }
  $('#homeBtn').onclick = () => { sTap(); renderHome(); };
  $('#againBtn').onclick = () => {
    sTap();
    if(session.mode==='exam') startExam();
    else if(session.mode==='flash') startFlash(session.catId);
    else startLesson(session.catId);
  };
}

/* ---------- شروع ---------- */
(async function boot(){
  await loadState();
  renderHome();
})();
</script>
</body>
</html>
